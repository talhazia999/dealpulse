<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealPulse installed</title>
<style>
  :root { --bg: #f6f7f9; --surface: #fff; --border: #e3e6eb; --text: #14171c; --muted: #5d6573; --accent: #4f46e5; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1014; --surface: #161a20; --border: #2a303a; --text: #e8ebf0; --muted: #a2aab8; --accent: #8b85ff; --accent-ink: #0e1014; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 14px 0 8px; }
  p, li { color: var(--muted); }
  ol { padding-left: 20px; margin: 12px 0 0; }
  svg { width: 36px; height: 36px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M5 17h6l3-7 4 13 3-6h6" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>DealPulse is installed</h1>
  <p>You can close this tab and go back to HubSpot.</p>
  <ol>
    <li>Open any deal record.</li>
    <li>Find the DealPulse card in the right sidebar.</li>
    <li>Click <strong>Analyze deal</strong>.</li>
  </ol>
</main>
</body>
</html>
